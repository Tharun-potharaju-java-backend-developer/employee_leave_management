spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
spring.datasource.enterprise-auth-db.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/enterpriseauthdb}
spring.datasource.enterprise-auth-db.username=${AUTH_DB_USERNAME:root}
spring.datasource.enterprise-auth-db.password=${AUTH_DB_PASSWORD}
spring.datasource.employee-management.url=${EMPLOYEE_DB_URL:jdbc:mysql://localhost:3306/employee_management}
spring.datasource.employee-management.username=${EMPLOYEE_DB_USERNAME:root}
spring.datasource.employee-management.password=${EMPLOYEE_DB_PASSWORD}
server.port=8081
#spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=DEBUG
#spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
refresh-token.secret=${REFRESH_TOKEN_SECRET:${JWT_SECRET}}
#24 hrs
jwt.expiration=86400000
refresh-token.expiration=2592000000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.endpoints.web.exposure.include=health,info,metrics,beans,env,loggers,threaddump