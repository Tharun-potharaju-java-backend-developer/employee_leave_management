services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: enterpriseauthdb
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the environment}
    ports:
      - "3307:3306"

  mysql1:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: employee_leave_management
      MYSQL_ROOT_PASSWORD: ${EMPLOYEE_DB_PASSWORD:?Set EMPLOYEE_DB_PASSWORD in the environment}
    ports:
      - "3308:3306"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
